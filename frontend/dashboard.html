<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - Gerenciamento de Água</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-dashboard">
  <header class="dashboard-topo">
    <span class="dashboard-topo__marca">Gerenciamento de Água</span>
    <nav class="dashboard-topo__nav" aria-label="Cadastros">
      <button type="button" class="dashboard-topo__link dashboard-topo__link--ativo" data-aba="usuarios">Usuários</button>
      <button type="button" class="dashboard-topo__link" data-aba="consumo" id="nav-aba-consumo" hidden>Consumo de Água</button>
    </nav>
    <div class="menu-usuario">
      <button id="usuario-menu-btn" class="btn-principal" aria-expanded="false">Olá, <span id="usuario-primeiro-nome">Usuário</span></button>
      <div id="usuario-menu-dropdown" class="menu-usuario__dropdown" hidden>
        <button id="logout" class="menu-usuario__logout">Sair</button>
      </div>
    </div>
  </header>

  <main class="dashboard-main pagina-login__card" style="max-width: 960px; transform: none; margin: 1.5rem auto 2rem;">
    <p class="dashboard-logado">Logado como: <strong id="usuario-nome">Usuário</strong> <span id="usuario-perfil-badge" class="dashboard-perfil" hidden></span></p>

    <!-- ========== USUÁRIOS (mantido) ========== -->
    <section id="painel-usuarios" class="dashboard-painel">
      <h1 class="dashboard-painel__titulo">Usuários — Listar</h1>

      <h2 class="dashboard-secao-titulo">Incluir / Editar Usuário</h2>
      <form id="form-usuario" class="form-acesso form-acesso--grid">
        <input type="hidden" id="usuario-id">
        <input class="form-acesso__input form-acesso__input--login-pagina" type="text" id="usuario-nome-input" placeholder="Nome" required>
        <input class="form-acesso__input form-acesso__input--login-pagina" type="email" id="usuario-email-input" placeholder="E-mail" required>
        <input class="form-acesso__input form-acesso__input--login-pagina" type="password" id="usuario-senha-input" placeholder="Senha (obrigatória ao incluir)">
        <div class="dashboard-form-acoes">
          <button type="submit" class="btn-principal">Salvar</button>
          <button type="button" id="cancelar-edicao" class="btn-principal">Cancelar</button>
        </div>
      </form>
      <p id="usuario-mensagem" class="form-acesso__mensagem"></p>

      <h2 class="dashboard-secao-titulo">Usuários Cadastrados</h2>
      <div class="dashboard-tabela-wrap">
        <table class="dashboard-tabela">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Perfil</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-usuarios"></tbody>
        </table>
      </div>
    </section>

    <!-- ========== CONSUMO (somente admin) — FEATURE reversível ========== -->
    <section id="painel-consumo" class="dashboard-painel" hidden>
      <h1 class="dashboard-painel__titulo">Consumo de Água — Listar</h1>

      <div class="crud-toolbar" role="toolbar" aria-label="Ações de consumo">
        <button type="button" id="consumo-btn-incluir" class="btn-crud btn-crud--incluir">Incluir</button>
        <button type="button" id="consumo-btn-editar" class="btn-crud btn-crud--editar">Editar</button>
        <button type="button" id="consumo-btn-excluir" class="btn-crud btn-crud--excluir">Excluir</button>
        <button type="button" id="consumo-btn-imprimir" class="btn-crud btn-crud--imprimir">Imprimir</button>
      </div>

      <form id="form-consumo" class="form-acesso form-acesso--grid dashboard-form-consumo" hidden>
        <input type="hidden" id="consumo-id">
        <label class="form-acesso__label" for="consumo-imovel">Imóvel</label>
        <select id="consumo-imovel" class="form-acesso__input form-acesso__input--login-pagina" required></select>
        <label class="form-acesso__label" for="consumo-leitura">Leitura (m³)</label>
        <input class="form-acesso__input form-acesso__input--login-pagina" type="number" id="consumo-leitura" step="0.01" min="0" placeholder="Leitura" required>
        <label class="form-acesso__label" for="consumo-datahora">Data/hora</label>
        <input class="form-acesso__input form-acesso__input--login-pagina" type="datetime-local" id="consumo-datahora">
        <div class="dashboard-form-acoes">
          <button type="submit" class="btn-principal">Salvar registro</button>
          <button type="button" id="consumo-cancelar" class="btn-principal">Cancelar</button>
        </div>
      </form>
      <p id="consumo-mensagem" class="form-acesso__mensagem"></p>

      <div id="area-impressao-consumo" class="dashboard-tabela-wrap">
        <table class="dashboard-tabela" id="tabela-consumo">
          <thead>
            <tr>
              <th class="col-selecao"><span class="sr-only">Selecionar</span></th>
              <th>ID</th>
              <th>Leitura</th>
              <th>Imóvel</th>
              <th>Proprietário</th>
              <th>Data</th>
            </tr>
          </thead>
          <tbody id="tabela-consumo-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  <script src="admin-consumo.js"></script>
</body>
</html>
