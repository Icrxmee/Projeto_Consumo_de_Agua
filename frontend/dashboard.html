<h2>Medições</h2>

<h2>Nova Medição</h2>

<form id="form-medicao">
  <input type="number" id="leitura" placeholder="Leitura (ex: 120)" required>

  <select id="imovel_id" required>
    <option value="">Selecione um imóvel</option>
  </select>

  <button type="submit">Cadastrar</button>
</form>

<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Leitura</th>
      <th>Imóvel</th>
      <th>Data</th>
      <th>Ações</th>
    </tr>
  </thead>
  <tbody id="tabela-medicoes"></tbody>
</table>
