<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Gerenciamento de Água</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-login">

  <div class="pagina-login__card">
    <h1 class="pagina-login__titulo">Login</h1>

    <form id="form-login" class="form-acesso form-acesso--login-pagina" novalidate>



      <label class="form-acesso__label" for="login-email">E-mail</label>
      <input class="form-acesso__input form-acesso__input--login-pagina" type="email" id="login-email" name="email" autocomplete="email" required>

      <label class="form-acesso__label" for="login-senha">Senha</label>
      <input class="form-acesso__input form-acesso__input--login-pagina" type="password" id="login-senha" name="senha" autocomplete="current-password" required>

      <p id="login-mensagem" class="form-acesso__mensagem" role="status" aria-live="polite"></p>

      <button type="submit" class="btn-principal btn-principal--enviar pagina-login__btn-enviar">Entrar</button>
    </form>

    <p class="pagina-login__rodape">
      Não tem conta?
      <a href="cadastro.html">Criar conta</a>
    </p>
  </div>

  <script src="app.js"></script>

</body>
</html>
